<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Benutzerverwaltung</title>
     <h:outputStylesheet library="css" name="style.css" />
</h:head>

<h:body>
    <!-- Geri dön / logout -->
    <h:form id="backForm" prependId="false">
        <h:commandButton value="Zurück" action="homepage.xhtml?faces-redirect=true" />
    </h:form>

    <div class="dialog-box">
        <h1>Benutzerverwaltung</h1>
        <h2>Wählen Sie eine Benutzeraktion aus</h2>

        <h:form>
            <div class="action-button">
                <h:commandButton value="Benutzer anlegen" action="benutzeranlegen.xhtml?faces-redirect=true" />
            </div>
            <div class="action-button">
                <h:commandButton value="Benutzer bearbeiten" action="benutzerbearbeiten.xhtml?faces-redirect=true" />
            </div>
            <div class="action-button">
                <h:commandButton value="Benutzer löschen" action="benutzerloeschen.xhtml?faces-redirect=true" />
            </div>
        </h:form>
    </div>
</h:body>
</html>
