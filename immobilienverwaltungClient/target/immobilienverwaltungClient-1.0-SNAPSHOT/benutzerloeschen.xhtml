<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Benutzer anzeigen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #3498db;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        #backForm {
            margin-bottom: 20px;
        }

        #backForm input[type="submit"] {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #backForm input[type="submit"]:hover {
            background-color: #2980b9;
        }
        #backButtonWrapper {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
    }

    #backButtonWrapper input[type="submit"] {
        padding: 8px 15px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }

    #backButtonWrapper input[type="submit"]:hover {
        background-color: #2980b9;
    }
    </style>
</h:head>

<h:body>
   <h:form id="backForm">
    <div id="backButtonWrapper">
        <h:commandButton value="Zurück" action="benutzerverwalten.xhtml?faces-redirect=true" />
    </div>
</h:form>

    <h1>Benutzerliste</h1>

    <h:form>
        <h:dataTable value="#{benutzerAnzeigenBean.benutzerListe}" var="benutzer">

            <h:column>
                <f:facet name="header">Benutzerkennung</f:facet>
                #{benutzer.benutzerkennung}
            </h:column>

            <h:column>
                <f:facet name="header">Vorname</f:facet>
                #{benutzer.vorname}                              
            </h:column>

            <h:column>
                <f:facet name="header">Telefonnummer</f:facet>
                #{benutzer.telefonnummer}
            </h:column>

            <h:column>
                <f:facet name="header">Rolle</f:facet>
                #{benutzer.rolle}
            </h:column>
            
            <h:column>
            <f:facet name="header">Aktion</f:facet>
            <h:commandButton value="🗑️"
                             action="#{benutzerLoeschenBean.benutzerLoeschen}"
                             onclick="return confirm('Möchten Sie wirklich löschen?');"
                             style="background:none; border:none; font-size:16px; color:red; cursor:pointer;"
                             title="Benutzer löschen">
                <f:setPropertyActionListener target="#{benutzerLoeschenBean.benutzerkennung}"
                                             value="#{benutzer.benutzerkennung}" />
            </h:commandButton>
     
            </h:column>

        </h:dataTable>
    </h:form>
</h:body>
</html>
