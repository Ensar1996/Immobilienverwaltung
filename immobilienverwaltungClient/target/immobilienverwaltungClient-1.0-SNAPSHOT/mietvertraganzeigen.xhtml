<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Mietverträge anzeigen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2em;
            background-color: #e3f2fd;
        }

        h1 {
            color: #0d47a1;
            text-align: center;
        }

        #backForm {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        #backForm input[type="submit"] {
            font-size: 14px;
            padding: 8px 15px;
            border-radius: 6px;
            background-color: #1976d2;
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease;
        }

        #backForm input[type="submit"]:hover {
            background-color: #1565c0;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background-color: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #bbdefb;
        }

        th {
            background-color: #1976d2;
            color: white;
            text-transform: uppercase;
        }

        tr:hover {
            background-color: #e3f2fd;
        }

        .table-wrapper {
            border: 1px solid #90caf9;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 30px;
        }

        .custom-message-box {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            text-align: center;
            animation: fadeOut 5s ease-in-out forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; display: none; }
        }
    </style>
</h:head>

<h:body>

    <h:form id="backForm" prependId="false">
        <h:commandButton value="Zurück" action="mietvertragpflegen.xhtml?faces-redirect=true" />
    </h:form>

    <h1>Mietvertragsübersicht</h1>

    <h:form>
        <h:messages globalOnly="true"
                    layout="table"
                    styleClass="custom-message-box"
                    showDetail="true"
                    showSummary="false" />
    </h:form>

    <div class="table-wrapper">
        <h:dataTable value="#{mietvertragAnzeigenBean.mietvertraege}" var="vertrag" styleClass="table">
            <h:column>
                <f:facet name="header">Vertragsnummer</f:facet>
                #{vertrag.vertragsnummer}
            </h:column>

            <h:column>
                <f:facet name="header">Mietbeginn</f:facet>
                <h:outputText value="#{vertrag.mietbeginn}">
                    <f:convertDateTime pattern="dd.MM.yyyy"/>
                </h:outputText>
            </h:column>

            <h:column>
                <f:facet name="header">Mietende</f:facet>
                <h:outputText value="#{vertrag.mietende}">
                    <f:convertDateTime pattern="dd.MM.yyyy"/>
                </h:outputText>
            </h:column>

            <h:column>
                <f:facet name="header">Miete</f:facet>
                #{vertrag.monatlicheMiete} €
            </h:column>

            <h:column>
                <f:facet name="header">Kaution</f:facet>
                #{vertrag.kaution} €
            </h:column>

            <h:column>
                <f:facet name="header">Status</f:facet>
                #{vertrag.vertragsstatus}
            </h:column>

            <h:column>
                <f:facet name="header">Mieter</f:facet>
                #{vertrag.mieterName}
            </h:column>
            
            <h:column>
                <f:facet name="header">Immobiliennummer</f:facet>
                #{vertrag.immobiliennummer}
            </h:column>
        </h:dataTable>
    </div>
</h:body>
</html>
