<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Homepage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="style.css" /> 
</h:head>

<h:body>
    <h:messages styleClass="feedback-messages" globalOnly="false" />
    <h:form id="backForm" prependId="false">
<h:commandButton value="Ausloggen" action="loggen.xhtml?faces-redirect=true" />
</h:form>
 
<div class="dialog-box">
<h1>IMMOBILIEN-VERWALTUNG</h1>
<h2>Wählen Sie eine Aktion aus</h2>
 
    <h:form>
<div class="action-button">
<h:commandButton value="Benutzer verwalten" 
                             action="benutzerverwalten.xhtml?faces-redirect=true"
                             rendered="#{einloggenBean.rolle eq 'ADMINISTRATOR'}" />
</div>
 
        <div class="action-button">
<h:commandButton value="Mieterinformationen pflegen"
                             action="mieterpflegen.xhtml?faces-redirect=true"
                             rendered="#{einloggenBean.rolle eq 'MITARBEITERVERMIETUNG'}" />
</div>
 
        <div class="action-button">
<h:commandButton value="Immobilienbestände verwalten"
                             action="immobilienverwalten.xhtml?faces-redirect=true"
                             rendered="#{einloggenBean.rolle eq 'MITARBEITERVERMIETUNG'}" />
</div>
 
        <div class="action-button">
<h:commandButton value="Alle aktuell verfügbaren Immobilien anzeigen"
                             action="verfuegbarenimmobilien.xhtml?faces-redirect=true"
                             rendered="#{einloggenBean.rolle eq 'MITARBEITERVERMIETUNG'}" />
</div>
 
        <div class="action-button">
<h:commandButton value="Mietverträge verwalten"
                             action="mietvertragpflegen.xhtml?faces-redirect=true"
                             rendered="#{einloggenBean.rolle eq 'MITARBEITERVERMIETUNG'}" />
</div>
 
        <div class="action-button">
<h:commandButton value="Reparaturaufträge verwalten"
                             action="reparaturauftrag.xhtml?faces-redirect=true"
                             rendered="#{einloggenBean.rolle eq 'MITARBEITERSERVICE'}" />
</div>
          
        <div class="action-button">
<h:commandButton value="Reparaturanfällige Wohnungen anzeigen"
                             action="reparaturanfaelligewohnungen.xhtml?faces-redirect=true"
                             rendered="#{einloggenBean.rolle eq 'MITARBEITERSERVICE'}" />
        </div>
    
</h:form>
</div>
</h:body>
</html>
