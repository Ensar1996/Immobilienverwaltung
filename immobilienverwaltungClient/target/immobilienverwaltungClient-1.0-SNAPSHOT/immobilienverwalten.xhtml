<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Immobilienverwaltung</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="style.css" /> 
</h:head>

<h:body>
    
    <h:form id="backForm" prependId="false">
        <h:commandButton value="Zurück" action="homepage.xhtml?faces-redirect=true" />
    </h:form>

    <div class="dialog-box">
        <h1>Immobilienverwaltung</h1>
        <h2>Wählen Sie eine Immobilienaktion aus</h2>

        <h:form>
            <div class="action-button">
                <h:commandButton value="Immobilien anlegen" action="immobilienanlegen.xhtml?faces-redirect=true" />
            </div>
            <div class="action-button">
                <h:commandButton value="Immobilien Pflegen" action="immobilienbearbeitenundloeschen.xhtml?faces-redirect=true" />
            </div>
            <div class="action-button">
                <h:commandButton value="Immobilien anzeigen" action="immobilienanzeigen.xhtml?faces-redirect=true" />
            </div>
        </h:form>
    </div>
</h:body>
</html>
