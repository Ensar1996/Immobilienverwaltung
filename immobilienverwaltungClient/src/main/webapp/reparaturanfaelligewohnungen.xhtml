<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Immobilien anzeigen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #3498db;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        #backForm {
            margin-bottom: 20px;
        }

        #backForm input[type="submit"] {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #backForm input[type="submit"]:hover {
            background-color: #2980b9;
        }
        #backButtonWrapper {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
    }

    #backButtonWrapper input[type="submit"] {
        padding: 8px 15px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }

    #backButtonWrapper input[type="submit"]:hover {
        background-color: #2980b9;
    }
    </style>
</h:head>

<h:body>
   <h:form id="backForm">
    <div id="backButtonWrapper">
        <h:commandButton value="Zurück" action="homepage.xhtml?faces-redirect=true" />
    </div>
</h:form>

    <h1>Reparaturanfällige Immobilien</h1>

    <h:form>
        <h:dataTable value="#{reparaturanfaelligeWohnungenBean.immobilienListe}" var="benutzer">

            <h:column>
                <f:facet name="header">Immobiliennummer</f:facet>
                #{benutzer.immobiliennummer}
            </h:column>

            <h:column>
                <f:facet name="header">Adresse</f:facet>
                #{benutzer.adresse}                              
            </h:column>

            <h:column>
                <f:facet name="header">Große</f:facet>
                #{benutzer.grosse}
            </h:column>

            <h:column>
                <f:facet name="header">Typ</f:facet>
                #{benutzer.typ}
            </h:column>
            
            <h:column>
                <f:facet name="header">Baujahr</f:facet>
                #{benutzer.baujahr}
            </h:column>
            
            <h:column>
                <f:facet name="header">Zustand</f:facet>
                #{benutzer.zustand}
            </h:column>
            
            <h:column>
                <f:facet name="header">MietpreisProMonat</f:facet>
                #{benutzer.mietpreisProMonat}
            </h:column>

        </h:dataTable>
    </h:form>
</h:body>
</html>
