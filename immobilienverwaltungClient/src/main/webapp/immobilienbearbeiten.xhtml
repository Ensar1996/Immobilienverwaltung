<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Immobilien bearbeiten</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
        }

        .form-container {
            background: #fff;
            padding: 40px 50px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-field {
            margin-bottom: 20px;
        }

        .form-field label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-field input,
        .form-field select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .submit-button {
            text-align: center;
        }

        .submit-button input[type="submit"] {
            background-color: #3498db;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-button input[type="submit"]:hover {
            background-color: #2980b9;
        }

        #backForm {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        #backForm input[type="submit"] {
            font-size: 14px;
            padding: 8px 15px;
            border-radius: 6px;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }

        #backForm input[type="submit"]:hover {
            background-color: #2980b9;
        }
    </style>
</h:head>

<h:body>

    <h:form id="backForm">
        <h:commandButton value="Zurück" action="immobilienverwalten.xhtml?faces-redirect=true" />
    </h:form>

    <div class="form-container">
        <h2>Immobilie anlegen</h2>

        <h:form id="anlegenForm" style="display: flex; gap: 40px; flex-wrap: wrap;">

            <!-- Linke Spalte: Adresse -->
            <div style="flex: 1; min-width: 250px;">
                <h3>Adresse</h3>
                <div class="form-field">
                    <label for="strasse">Strasse</label>
                    <h:inputText id="strasse" value="#{immobilienBearbeitenBean.adresse.strasse}" required="true" />
                </div>
                <div class="form-field">
                    <label for="hausnummer">Hausnummer</label>
                    <h:inputText id="hausnummer" value="#{immobilienBearbeitenBean.adresse.hausnummer}" required="true" />
                </div>
                <div class="form-field">
                    <label for="plz">PLZ</label>
                    <h:inputText id="plz" value="#{immobilienBearbeitenBean.adresse.plz}" required="true" />
                </div>
                <div class="form-field">
                    <label for="stadt">Stadt</label>
                    <h:inputText id="stadt" value="#{immobilienBearbeitenBean.adresse.stadt}" required="true" />
                </div>
            </div>

            <!-- Rechte Spalte: Andere Infos -->
            <div style="flex: 1; min-width: 250px;">
                <div class="form-field">
                    <label for="groesse">Größe (m²)</label>
                    <h:inputText id="groesse" value="#{immobilienBearbeitenBean.grosse}" required="true" />
                </div>

                <div class="form-field">
                    <label for="typ">Immobilientyp</label>
                    <h:selectOneMenu id="typ" value="#{immobilienBearbeitenBean.typ}" required="true">
                        <f:selectItem itemLabel="Bitte wählen..." itemValue="" />
                        <f:selectItem itemLabel="Wohnung" itemValue="WOHNUNG" />
                        <f:selectItem itemLabel="Haus" itemValue="HAUS" />
                        <f:selectItem itemLabel="Büro" itemValue="BUERO" />
                    </h:selectOneMenu>
                </div>

                <div class="form-field">
                    <label for="baujahr">Baujahr</label>
                    <h:inputText id="baujahr" value="#{immobilienBearbeitenBean.baujahr}" required="true" />
                </div>

                <div class="form-field">
                    <label for="zustand">Zustand</label>
                    <h:selectOneMenu id="zustand" value="#{immobilienBearbeitenBean.zustand}" required="true">
                        <f:selectItem itemLabel="Bitte wählen..." itemValue="" />
                        <f:selectItem itemLabel="Neu" itemValue="NEU" />
                        <f:selectItem itemLabel="Renoviert" itemValue="RENOVIERT" />
                        <f:selectItem itemLabel="Renovierungsbedürftig" itemValue="RENOVIERUNGSBEDUERFTIG" />
                    </h:selectOneMenu>
                </div>

                <div class="form-field">
                    <label for="mietpreisProMonat">Mietpreis pro Monat (€)</label>
                    <h:inputText id="mietpreisProMonat" value="#{immobilienBearbeitenBean.mietpreisProMonat}" required="true" />
                </div>
            </div>

            
            <div class="submit-button">
                <h:commandButton value="Speichern" action="#{immobilienBearbeitenBean.immobilienUpdate}" />
            </div>
        </h:form>
    </div>

</h:body>
</html>
