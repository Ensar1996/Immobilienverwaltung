<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Benutzer anlegen</title>
    <style>
     :root {
    --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    --bg-color: #e6f0fa;
    --container-bg: #ffffff;
    --primary-color: #3498db;
    --primary-hover: #2980b9;
    --text-color: #2c3e50;
    --border-radius: 12px;
    --box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    --transition-speed: 0.3s;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

    html, body {
            height: 100%;
            font-family: var(--font-family);
            background:
                linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)),
                url("#{resource['images/immo.png']}") no-repeat center bottom fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }

.form-container {
    background: var(--container-bg);
    padding: 50px 60px;
    border-radius: var(--border-radius);
    box-shadow: var(--box-shadow);
    width: 100%; 
    max-width: 600px;
    text-align: center;
}

.custom-message-box ul,
.custom-message-box li,
.custom-message-box::before,
.custom-message-box span::before {
    list-style: none !important;
    content: none !important;
    display: inline !important;
}


@keyframes fadeOut {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; display: none; }
}

.custom-message-box {
  background-color: #d4edda;
  color: #155724;
  border: 1px solid #c3e6cb;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-weight: 500;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
  width: 100%;
  max-width: 600px;
  text-align: center;

 
  animation: fadeOut 4s ease-in-out forwards;
}
h2 {
    font-size: 28px;
    margin-bottom: 30px;
}

.form-field {
    margin-bottom: 20px;
    text-align: left;
}

.form-field label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
}

.form-field input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    transition: border-color var(--transition-speed);
}

.form-field input:focus {
    border-color: var(--primary-color);
    outline: none;
}

.submit-button {
    margin-top: 30px;
}

.custom-button {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    background-color: var(--primary-color);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color var(--transition-speed);
}

.custom-button:hover {
    background-color: var(--primary-hover);
}

#backForm {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
}

#backForm input[type="submit"] {
    font-size: 14px;
    padding: 8px 15px;
    border-radius: 6px;
    background-color: var(--primary-color);
    color: white;
    border: none;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    transition: background-color var(--transition-speed);
}

#backForm input[type="submit"]:hover {
    background-color: var(--primary-hover);
}

@media (max-width: 600px) {
    .form-container {
        padding: 30px 20px;
    }

    .form-field input {
        font-size: 14px;
        padding: 10px;
    }

    .custom-button {
        font-size: 16px;
        padding: 12px;
    }

}
    </style>
</h:head>

<h:body>
    
    <h:form id="backForm">
        <h:commandButton value="Zurück" action="benutzerverwalten.xhtml?faces-redirect=true" />
    </h:form>

    <div class="form-container">
        <h2>Benutzer anlegen</h2>

       
        <h:form id="anlegenForm">
            <div class="form-field">
                <label for="benutzerkennung">Benutzerkennung</label>
                <h:inputText id="benutzerkennung" value="#{benutzerAnlegenBean.benutzerkennung}" required="true" />
            </div>

            <div class="form-field">
                <label for="passwort">Passwort</label>
                <h:inputSecret id="passwort" value="#{benutzerAnlegenBean.passwort}" required="true" />
            </div>

            <div class="form-field">
                <label for="name">Name</label>
                <h:inputText id="name" value="#{benutzerAnlegenBean.name}" required="true" />
            </div>

            <div class="form-field">
                <label for="telefonnummer">Telefonnummer</label>
                <h:inputText id="telefonnummer" value="#{benutzerAnlegenBean.telefonnumer}" required="true" />
            </div>

            <div class="form-field">
                <label for="rolle">Benutzerrolle</label>
                <h:selectOneMenu id="rolle" value="#{benutzerAnlegenBean.rolle}">
                    <f:selectItem itemLabel="Bitte wählen..." itemValue="" />
                    <f:selectItem itemLabel="ADMINISTRATOR" itemValue="ADMINISTRATOR" />
                    <f:selectItem itemLabel="MITARBEITERSERVICE" itemValue="MITARBEITERSERVICE" />
                    <f:selectItem itemLabel="MITARBEITERVERMITUNG" itemValue="MITARBEITERVERMITUNG" />
                </h:selectOneMenu>
            </div>

            <div class="submit-button">
                <h:commandButton value="Speichern" action="#{benutzerAnlegenBean.benutzerAnlegen}" />
            </div>
        </h:form>
    </div>
</h:body>
</html>
