<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Reparaturauftrag anlegen</title>
    <style>
        :root {
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --bg-color: #e6f0fa;
            --container-bg: #ffffff;
            --primary-color: #3498db;
            --primary-hover: #2980b9;
            --text-color: #2c3e50;
            --border-radius: 12px;
            --box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            --transition-speed: 0.3s;
        }

        html, body {
            height: 100%;
            font-family: var(--font-family);
            background:
                linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)),
                url("#{resource['images/immo.png']}") no-repeat center bottom fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }

        .form-container {
            background: var(--container-bg);
            padding: 50px 60px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .form-field {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-field label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-field input,
        .form-field textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-field input:focus,
        .form-field textarea:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .submit-button {
            margin-top: 30px;
        }

        .custom-button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color var(--transition-speed);
        }

        .custom-button:hover {
            background-color: var(--primary-hover);
        }

        #backForm {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        #backForm input[type="submit"] {
            font-size: 14px;
            padding: 8px 15px;
            border-radius: 6px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
        }

        .custom-message-box {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
            max-width: 600px;
            text-align: center;
            animation: fadeOut 4s ease-in-out forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; display: none; }
        }
    </style>
</h:head>
<h:body>

    <!-- Zurück-Button -->
    <h:form id="backForm">
        <h:commandButton value="Zurück" action="reparaturauftrag.xhtml?faces-redirect=true" />
    </h:form>

    <div class="form-container">

        <h:form id="messagesForm">
            <h:messages styleClass="custom-message-box"
                        globalOnly="false"
                        layout="table"
                        showDetail="true"
                        showSummary="false" />
        </h:form>

        <h2>Reparaturauftrag anlegen</h2>

        <h:form id="auftragForm">
            <div class="form-field">
                <label for="auftragsnummer">Auftragsnummer</label>
                <h:inputText id="auftragsnummer" value="#{reparaturauftragAnlegenBean.auftragsnummer}" required="true" />
            </div>

            <div class="form-field">
                <label for="wartungsdatum">Wartungsdatum</label>
                <h:inputText id="wartungsdatum" value="#{reparaturauftragAnlegenBean.wartungsdatum}" required="true">
                    <f:converter converterId="localDateConverter" />
                </h:inputText>
            </div>

            <div class="form-field">
                <label for="beschreibung">Beschreibung</label>
                <h:inputTextarea id="beschreibung" value="#{reparaturauftragAnlegenBean.beschreibung}" rows="3" required="true" />
            </div>

            <div class="form-field">
                <label for="massnahmen">Maßnahmen</label>
                <h:inputTextarea id="massnahmen" value="#{reparaturauftragAnlegenBean.massnahmen}" rows="2" />
            </div>

            <div class="form-field">
                <label for="wartungsstatus">Wartungsstatus</label>
                <h:selectOneMenu id="wartungsstatus" value="#{reparaturauftragAnlegenBean.wartungsstatus}" required="true">
                    <f:selectItem itemLabel="Bitte wählen" itemValue="" />
                    <f:selectItems value="#{reparaturauftragAnlegenBean.wartungsstatusListe}" />
                </h:selectOneMenu>
            </div>

            <div class="form-field">
                <label for="immobiliennummer">Immobiliennummer</label>
                <h:inputText id="immobiliennummer" value="#{reparaturauftragAnlegenBean.immobiliennummer}" required="true" />
            </div>

            <div class="submit-button">
                <h:commandButton value="Speichern" action="#{reparaturauftragAnlegenBean.reparaturauftragAnlegen}" styleClass="custom-button" />
            </div>
        </h:form>
    </div>
</h:body>
</html>
