<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Benutzer bearbeiten</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f2f5;
        }

        .form-container {
            background: #fff;
            padding: 40px 50px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-field {
            margin-bottom: 20px;
        }

        .form-field label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-field input,
        .form-field select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        .submit-button {
            text-align: center;
        }

        .submit-button input[type="submit"] {
            background-color: #3498db;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-button input[type="submit"]:hover {
            background-color: #2980b9;
        }

        #backForm {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        #backForm input[type="submit"] {
            font-size: 14px;
            padding: 8px 15px;
            border-radius: 6px;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }

        #backForm input[type="submit"]:hover {
            background-color: #2980b9;
        }
    </style>
</h:head>

<h:body>

<h:form id="backForm">
    <h:commandButton value="Zurück" action="benutzerverwalten.xhtml?faces-redirect=true" />
</h:form>

<div class="form-container">
    <h2>Benutzer bearbeiten</h2>

    <h:form id="bearbeitenForm">
        <div class="form-field">
            <label for="benutzerkennung">Benutzerkennung</label>
            <h:inputText id="benutzerkennung" value="#{benutzerBearbeitenBean.benutzerkennung}"  readonly="true" />
        </div>

        <div class="form-field">
            <label for="passwort">Passwort</label>
            <h:inputSecret id="passwort" value="#{benutzerBearbeitenBean.passwort}" required="true" />
        </div>

        <div class="form-field">
            <label for="name">Name</label>
            <h:inputText id="name" value="#{benutzerBearbeitenBean.name}" required="true" />
        </div>

        <div class="form-field">
            <label for="telefonnummer">Telefonnummer</label>
            <h:inputText id="telefonnummer" value="#{benutzerBearbeitenBean.telefonnummer}" required="true" />
        </div>

        <div class="form-field">
            <label for="rolle">Benutzerrolle</label>
            <h:selectOneMenu id="rolle" value="#{benutzerBearbeitenBean.rolle}">
                <f:selectItem itemLabel="Bitte wählen..." itemValue="" />
                <f:selectItem itemLabel="ADMINISTRATOR" itemValue="ADMINISTRATOR" />
                <f:selectItem itemLabel="MITARBEITERSERVICE" itemValue="MITARBEITERSERVICE" />
                <f:selectItem itemLabel="MITARBEITERVERMITUNG" itemValue="MITARBEITERVERMITUNG" />
            </h:selectOneMenu>
        </div>

        <div class="submit-button">
            <h:commandButton value="Speichern" action="#{benutzerBearbeitenBean.benutzerUpdate}" />
        </div>
    </h:form>
</div>
</h:body>
</html>
