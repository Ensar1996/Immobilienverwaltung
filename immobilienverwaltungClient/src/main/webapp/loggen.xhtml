<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
<style>
        :root {
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --bg-color: #e6f0fa;
            --container-bg: #ffffff;
            --primary-color: #3498db;
            --primary-hover: #2980b9;
            --text-color: #2c3e50;
            --border-radius: 12px;
            --box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            --transition-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
    height: 100%;
    font-family: var(--font-family);
    background:  
    linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)),    
    url("#{resource['images/immo.png']}") no-repeat center bottom fixed;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--text-color);
}

        .form-container {
            background: var(--container-bg);
            padding: 50px 60px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 30px;
            font-weight: normal;
        }

        .form-row {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-row label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-row input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color var(--transition-speed);
        }

        .form-row input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .button-wrapper {
            margin-top: 30px;
        }

        h\\:commandButton {
            width: 100%;
        }

        .form-container h\\:commandButton input {
            background-color: var(--primary-color);
            color: white;
            font-size: 18px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color var(--transition-speed);
            width: 100%;
        }

        .form-container h\\:commandButton input:hover {
            background-color: var(--primary-hover);
        }

        @media (max-width: 600px) {
            .form-container {
                padding: 30px 20px;
            }
        }
    </style>
</h:head>
<h:body>
    <div class="form-container">
        <div style="text-align: center; margin-bottom: 20px;">
            <h1>WILLKOMMEN</h1>
            <h2>IMMOBILIEN-VERWALTEN</h2>
        </div>

        <h:form>
    <div class="form-row">
        <label for="getbenutzerkennung">Username:</label>
        <h:inputText id="getbenutzerkennung" value="#{einloggenBean.benutzerkennung}" />
    </div>
    <div class="form-row">
        <label for="getpasswort">Passwort:</label>
        <h:inputSecret id="getpasswort" value="#{einloggenBean.passwort}" />
    </div>
    <div class="form-row">
        <label for="rolle">Rolle auswählen:</label>
        <h:selectOneMenu id="rolle" value="#{einloggenBean.rolle}">
    <f:selectItem itemLabel="Bitte wählen" itemValue="" />
    <f:selectItem itemLabel="Vermietung" itemValue="MITARBEITERVERMIETUNG" />
    <f:selectItem itemLabel="Service" itemValue="MITARBEITERSERVICE" />
    <f:selectItem itemLabel="Administrator" itemValue="ADMINISTRATOR" />
    </h:selectOneMenu>

    </div>
    <div class="button-wrapper">
        <h:commandButton value="Einloggen" action="#{einloggenBean.einloggen}" />
    </div>
</h:form>

    </div>
</h:body>
</html>
