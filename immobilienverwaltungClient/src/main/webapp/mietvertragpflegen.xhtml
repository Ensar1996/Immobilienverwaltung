<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>Mietvertragsverwaltung</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="style.css" /> 
    
</h:head>

<h:body>
    <!-- Zurück-Button -->
    <h:form id="backForm" prependId="false">
        <h:commandButton value="Zurück" action="homepage.xhtml?faces-redirect=true" />
    </h:form>

    <div class="dialog-box">
        <h1>Mietvertragsverwaltung</h1>
        <h2>Wählen Sie eine Aktion aus</h2>

        <h:form>
            <div class="action-button">
                <h:commandButton value="Mietvertrag anlegen" action="mietvertraganlegen.xhtml?faces-redirect=true" />
            </div>
            <div class="action-button">
                <h:commandButton value="Mietvertrag verlängern" action="mietvertragverlaengern.xhtml?faces-redirect=true" />
            </div>
            <div class="action-button">
                <h:commandButton value="Alle Mietverträge" action="mietvertraganzeigen.xhtml?faces-redirect=true" />
            </div>
            <div class="action-button">
                <h:commandButton value="Mietvertrag kündigen" action="mietvertragkuendigen.xhtml?faces-redirect=true" />
            </div>
        </h:form>
    </div>
</h:body>
</html>
