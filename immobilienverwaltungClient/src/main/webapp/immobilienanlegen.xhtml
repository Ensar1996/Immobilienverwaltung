<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Immobilien anlegen</title>
    <style>
        
     :root {
    --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    --bg-color: #e6f0fa;
    --container-bg: #ffffff;
    --primary-color: #3498db;
    --primary-hover: #2980b9;
    --text-color: #2c3e50;
    --border-radius: 12px;
    --box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    --transition-speed: 0.3s;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

    html, body {
            height: 100%;
            font-family: var(--font-family);
            background:
                linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)),
                url("#{resource['images/immo.png']}") no-repeat center bottom fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }

.form-container {
    background: var(--container-bg);
    padding: 50px 60px;
    border-radius: var(--border-radius);
    box-shadow: var(--box-shadow);
    width: 100%; 
    max-width: 600px;
    text-align: center;
}

.custom-message-box ul,
.custom-message-box li,
.custom-message-box::before,
.custom-message-box span::before {
    list-style: none !important;
    content: none !important;
    display: inline !important;
}


@keyframes fadeOut {
  0% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; display: none; }
}

.custom-message-box {
  background-color: #d4edda;
  color: #155724;
  border: 1px solid #c3e6cb;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-weight: 500;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
  width: 100%;
  max-width: 600px;
  text-align: center;

 
  animation: fadeOut 4s ease-in-out forwards;
}
h2 {
    font-size: 28px;
    margin-bottom: 30px;
}

.form-field {
    margin-bottom: 20px;
    text-align: left;
}

.form-field label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
}

.form-field input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    transition: border-color var(--transition-speed);
}

.form-field input:focus {
    border-color: var(--primary-color);
    outline: none;
}

.submit-button {
    margin-top: 30px;
}

.custom-button {
    width: 100%;
    padding: 14px;
    font-size: 18px;
    background-color: var(--primary-color);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color var(--transition-speed);
}

.custom-button:hover {
    background-color: var(--primary-hover);
}

#backForm {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
}

#backForm input[type="submit"] {
    font-size: 14px;
    padding: 8px 15px;
    border-radius: 6px;
    background-color: var(--primary-color);
    color: white;
    border: none;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    transition: background-color var(--transition-speed);
}

#backForm input[type="submit"]:hover {
    background-color: var(--primary-hover);
}

@media (max-width: 600px) {
    .form-container {
        padding: 30px 20px;
    }

    .form-field input {
        font-size: 14px;
        padding: 10px;
    }

    .custom-button {
        font-size: 16px;
        padding: 12px;
    }

}
    
    </style>
</h:head>

<h:body>

    <h:form id="backForm">
        <h:commandButton value="Zurück" action="immobilienverwalten.xhtml?faces-redirect=true" />
    </h:form>

    <div class="form-container">
        <h2>Immobilie anlegen</h2>

        <h:form id="anlegenForm" style="display: flex; gap: 40px; flex-wrap: wrap;">

            <!-- Linke Spalte: Adresse -->
            <div style="flex: 1; min-width: 250px;">
                <h3>Adresse</h3>
                <div class="form-field">
                    <label for="strasse">Strasse</label>
                    <h:inputText id="strasse" value="#{immobilienAnlegenBean.adresse.strasse}" required="true" />
                </div>
                <div class="form-field">
                    <label for="hausnummer">Hausnummer</label>
                    <h:inputText id="hausnummer" value="#{immobilienAnlegenBean.adresse.hausnummer}" required="true" />
                </div>
                <div class="form-field">
                    <label for="plz">PLZ</label>
                    <h:inputText id="plz" value="#{immobilienAnlegenBean.adresse.plz}" required="true" />
                </div>
                <div class="form-field">
                    <label for="stadt">Stadt</label>
                    <h:inputText id="stadt" value="#{immobilienAnlegenBean.adresse.stadt}" required="true" />
                </div>
            </div>

            <!-- Rechte Spalte: Andere Infos -->
            <div style="flex: 1; min-width: 250px;">
                <div class="form-field">
                    <label for="groesse">Größe (m²)</label>
                    <h:inputText id="groesse" value="#{immobilienAnlegenBean.grosse}" required="true" />
                </div>

                <div class="form-field">
                    <label for="typ">Immobilientyp</label>
                    <h:selectOneMenu id="typ" value="#{immobilienAnlegenBean.typ}" required="true">
                        <f:selectItem itemLabel="Bitte wählen..." itemValue="" />
                        <f:selectItem itemLabel="Wohnung" itemValue="WOHNUNG" />
                        <f:selectItem itemLabel="Haus" itemValue="HAUS" />
                        <f:selectItem itemLabel="Büro" itemValue="BUERO" />
                    </h:selectOneMenu>
                </div>

                <div class="form-field">
                    <label for="baujahr">Baujahr</label>
                    <h:inputText id="baujahr" value="#{immobilienAnlegenBean.baujahr}" required="true" />
                </div>

                <div class="form-field">
                    <label for="zustand">Zustand</label>
                    <h:selectOneMenu id="zustand" value="#{immobilienAnlegenBean.zustand}" required="true">
                        <f:selectItem itemLabel="Bitte wählen..." itemValue="" />
                        <f:selectItem itemLabel="Neu" itemValue="NEU" />
                        <f:selectItem itemLabel="Renoviert" itemValue="RENOVIERT" />
                        <f:selectItem itemLabel="Renovierungsbedürftig" itemValue="RENOVIERUNGSBEDUERFTIG" />
                    </h:selectOneMenu>
                </div>

                <div class="form-field">
                    <label for="mietpreisProMonat">Mietpreis pro Monat (€)</label>
                    <h:inputText id="mietpreisProMonat" value="#{immobilienAnlegenBean.mietpreisProMonat}" required="true" />
                </div>
            </div>

            
            <div class="submit-button">
                <h:commandButton value="Speichern" action="#{immobilienAnlegenBean.immobilienAnlegen}" />
            </div>
        </h:form>
    </div>

</h:body>
</html>
