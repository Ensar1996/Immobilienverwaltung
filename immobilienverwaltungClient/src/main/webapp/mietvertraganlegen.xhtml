<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Mietvertrag anlegen</title>
    <style>
        /* === Dein gesamtes Design vom Mieter-Anlegen übernommen === */
        :root {
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --bg-color: #e6f0fa;
            --container-bg: #ffffff;
            --primary-color: #3498db;
            --primary-hover: #2980b9;
            --text-color: #2c3e50;
            --border-radius: 12px;
            --box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            --transition-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: var(--font-family);
            background:
                linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)),
                url("#{resource['images/immo.png']}") no-repeat center bottom fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }

        .form-container {
            background: var(--container-bg);
            padding: 50px 60px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 30px;
        }

        .form-field {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-field label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-field input, .form-field select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color var(--transition-speed);
        }

        .form-field input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .submit-button {
            margin-top: 30px;
        }

        .custom-button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color var(--transition-speed);
        }

        .custom-button:hover {
            background-color: var(--primary-hover);
        }

        #backForm {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        #backForm input[type="submit"] {
            font-size: 14px;
            padding: 8px 15px;
            border-radius: 6px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: background-color var(--transition-speed);
        }

        #backForm input[type="submit"]:hover {
            background-color: var(--primary-hover);
        }

        .custom-message-box {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            text-align: center;
            animation: fadeOut 4s ease-in-out forwards;
        }
        
        /* Entfernt den grünen Punkt (Standard-Icon) */
        .custom-message-box ul,
        .custom-message-box li,
        .custom-message-box::before,
        .custom-message-box span::before {
        list-style: none !important;
        content: none !important;
        display: inline !important;
}


        @keyframes fadeOut {
            0% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; display: none; }
        }
    </style>
</h:head>

<h:body>

    <h:form id="backForm">
        <h:commandButton value="Zurück" action="mietvertragpflegen.xhtml?faces-redirect=true" />
    </h:form>

    <div class="form-container">
        <h:form id="messageForm">
            <h:messages styleClass="custom-message-box"
                        globalOnly="false"
                        layout="none"
                        showDetail="true"
                        showSummary="false" />
        </h:form>

        <h2>Mietvertrag anlegen</h2>

        <h:form id="mietvertragForm">

            
            <div class="form-field">
                <label for="mietbeginn">Mietbeginn</label>
                <h:inputText id="mietbeginn" value="#{mietvertragAnlegenBean.mietbeginn}" required="true">
                    <f:convertDateTime pattern="dd.MM.yyyy" />
                </h:inputText>
            </div>

            <div class="form-field">
                <label for="mietende">Mietende</label>
                <h:inputText id="mietende" value="#{mietvertragAnlegenBean.mietende}" required="true">
                    <f:convertDateTime pattern="dd.MM.yyyy" />
                </h:inputText>
            </div>

            <div class="form-field">
                <label for="monatlicheMiete">Monatliche Miete</label>
                <h:inputText id="monatlicheMiete" value="#{mietvertragAnlegenBean.monatlicheMiete}" required="true" />
            </div>

            <div class="form-field">
                <label for="kaution">Kaution</label>
                <h:inputText id="kaution" value="#{mietvertragAnlegenBean.kaution}" required="true" />
            </div>

            <div class="form-field">
                <label for="vertragsstatus">Vertragsstatus</label>
                <h:selectOneMenu id="vertragsstatus" value="#{mietvertragAnlegenBean.vertragsstatus}" required="true">
                    <f:selectItem itemLabel="Bitte wählen" itemValue="" noSelectionOption="true" />
                    <f:selectItems value="#{mietvertragAnlegenBean.vertragsstatusList}" />
                </h:selectOneMenu>
            </div>

            <div class="form-field">
                <label for="mieterId">Mieter-ID</label>
                <h:inputText id="mieterId" value="#{mietvertragAnlegenBean.mieterId}" required="true" />
            </div>
            <div class="form-field">
            <label for="immobiliennummer">Immobiliennummer</label>
            <h:inputText id="immobiliennummer"
                 value="#{mietvertragAnlegenBean.immobiliennummer}"
                 required="true" />
            </div> 
            
            <div class="submit-button">
                <h:commandButton value="Speichern"
                                 action="#{mietvertragAnlegenBean.mietvertragAnlegen}"
                                 styleClass="custom-button" />
            </div>
        </h:form>
    </div>
</h:body>
</html>
